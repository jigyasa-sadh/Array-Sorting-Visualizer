<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Sorting Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>ARRAY SORTING VISUALIZER</h1>

        <!-- Controls Section -->
        <div class="controls">
            <select id="algorithm-select">
                <option value="bubble">Bubble Sort</option>
                <option value="insertion">Insertion Sort</option>
                <option value="selection">Selection Sort</option>
                <option value="merge">Merge Sort</option>
                <option value="quick">Quick Sort</option>
                <option value="shell">Shell Sort</option>
                <option value="radix">Radix Sort</option>
            </select>

            <button id="btn-generate">New Array</button>
            <button id="btn-start">Sort Array</button>
        </div>

        <!-- Visualizer Bars Container (Video Style Center) -->
        <div class="visualizer" id="visualizer-container"></div>

        <!-- Complexity Display Box -->
        <div class="complexity-box">
            <pre id="complexity-display">Select an algorithm</pre>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
